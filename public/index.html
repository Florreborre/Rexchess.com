<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schack Online</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#5a1313">
  <script>
    // Sätter ljust/mörkt läge innan sidan ritas, så att den inte blinkar till i fel färg.
    try {
      var s = JSON.parse(localStorage.getItem('settings') || '{}'), t = s.theme || 'auto';
      document.documentElement.dataset.theme = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/wow.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/play"><img class="logo" src="/favicon.svg" alt=""><span>Schack Online<small>Spela · Träna · Tävla</small></span></a>
    <nav id="nav"></nav>
    <div id="userbox"></div>
  </header>
  <main id="app"></main>
  <footer class="foot">Motor: Stockfish (GPLv3) · Pjäser: Cburnett / Wikimedia Commons (CC BY-SA 3.0) · Ljud: Kenney (CC0), Enigmahack / Lichess (AGPLv3+)</footer>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
